<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda AI — Asistente de Compras</title>
  <meta name="description" content="Chatea con nuestro asistente de compras inteligente. Explora productos, arma tu carrito y compra fácilmente." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #161622;
      --surface-glass: rgba(22, 22, 34, 0.85);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --user-bg: linear-gradient(135deg, #6366f1, #4f46e5);
      --bot-bg: rgba(255,255,255,0.04);
      --radius: 24px;
      --radius-sm: 16px;
      --shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(99,102,241,0.10), transparent),
        radial-gradient(ellipse 50% 40% at 85% 85%, rgba(79,70,229,0.08), transparent),
        var(--bg);
    }

    .bg-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .center-brand {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    .center-brand .logo-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(79,70,229,0.1));
      border: 1px solid rgba(99,102,241,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      box-shadow: 0 0 40px rgba(99,102,241,0.2);
      animation: float 4s ease-in-out infinite;
    }

    .center-brand h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.1;
    }

    .center-brand h1 span {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .center-brand p {
      margin-top: 14px;
      font-size: 1.05rem;
      color: var(--text-dim);
      font-weight: 400;
    }

    .center-brand .hint {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--text-dim);
      opacity: 0.6;
    }

    .hint-arrow {
      font-size: 1.3rem;
      animation: bounce-left 1.8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bounce-left {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-8px); }
    }

    /* Chat Bubble */
    #chat-bubble {
      position: fixed;
      bottom: 28px;
      left: 28px;
      z-index: 1000;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(99,102,241,0.45), 0 0 0 0 rgba(99,102,241,0.4);
      transition: transform var(--transition), box-shadow var(--transition);
      animation: pulse-ring 3s ease-out infinite;
    }

    #chat-bubble:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(99,102,241,0.6), 0 0 0 0 rgba(99,102,241,0); }
    #chat-bubble:active { transform: scale(0.95); }

    #chat-bubble svg { transition: transform var(--transition), opacity var(--transition); }
    #chat-bubble .icon-close { display: none; }
    #chat-bubble.open .icon-chat { display: none; }
    #chat-bubble.open .icon-close { display: block; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 8px 32px rgba(99,102,241,0.45), 0 0 0 0 rgba(99,102,241,0.4); }
      70% { box-shadow: 0 8px 32px rgba(99,102,241,0.45), 0 0 0 18px rgba(99,102,241,0); }
      100% { box-shadow: 0 8px 32px rgba(99,102,241,0.45), 0 0 0 0 rgba(99,102,241,0); }
    }

    .notif-dot {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 14px;
      height: 14px;
      background: #f43f5e;
      border-radius: 50%;
      border: 2px solid var(--bg);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Chat Window */
    #chat-window {
      position: fixed;
      bottom: 104px;
      left: 28px;
      z-index: 999;
      width: 400px;
      max-height: 580px;
      border-radius: var(--radius);
      background: var(--surface-glass);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px) saturate(1.4);
      transform-origin: bottom left;
      transform: scale(0.88) translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }

    #chat-window.visible {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    /* Header */
    .chat-header {
      padding: 18px 20px;
      background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(79,70,229,0.08));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .chat-header .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    .chat-header .info { flex: 1; min-width: 0; }
    .chat-header .name { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .chat-header .status {
      font-size: 0.75rem;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 5px; }

    .msg {
      display: flex;
      gap: 10px;
      animation: msg-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 3px;
      border: 1px solid var(--border);
    }

    .msg.user .msg-avatar {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
    }

    .msg-bubble {
      max-width: 76%;
      padding: 11px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.bot .msg-bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      color: var(--text);
    }

    .msg.user .msg-bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 6px;
      color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,0.25);
    }

    /* Typing */
    .typing-indicator {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .typing-bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: typing 1.5s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* Input */
    .chat-input-area {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 16px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      resize: none;
      outline: none;
      max-height: 100px;
      min-height: 42px;
      line-height: 1.5;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #chat-input::placeholder { color: var(--text-dim); }

    #chat-input:focus {
      border-color: rgba(99,102,241,0.5);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.08);
    }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition), opacity var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    #send-btn:hover { transform: scale(1.08); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Responsive */
    @media (max-width: 480px) {
      #chat-window {
        left: 14px;
        right: 14px;
        width: auto;
        bottom: 90px;
        max-height: 70vh;
      }
      #chat-bubble {
        bottom: 18px;
        left: 18px;
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>

  <div class="center-brand">
    <div class="logo-ring">🛍️</div>
    <h1>Tienda AI<br /><span>Shopping Assistant</span></h1>
    <p>Tu asistente personal de moda inteligente</p>
    <div class="hint">
      <span class="hint-arrow">←</span>
      <span>Abre el chat para comenzar</span>
    </div>
  </div>

  <button id="chat-bubble" aria-label="Abrir chat" title="Hablar con el Asistente">
    <div class="notif-dot" id="notif-dot"></div>
    <svg class="icon-chat" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <div id="chat-window" role="dialog" aria-label="Chat con el Asistente">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="info">
        <div class="name">Asistente AI</div>
        <div class="status">
          <span class="status-dot"></span>
          En línea · Listo para ayudarte
        </div>
      </div>
    </div>

    <div id="messages" role="log" aria-live="polite"></div>

    <div class="chat-input-area">
      <textarea
        id="chat-input"
        placeholder="Escribe un mensaje..."
        rows="1"
        aria-label="Mensaje"
      ></textarea>
      <button id="send-btn" aria-label="Enviar" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const state = {
      open: false,
      loading: false,
      sessionId: null,
      history: [],
    };

    const bubble   = document.getElementById('chat-bubble');
    const window_  = document.getElementById('chat-window');
    const messages = document.getElementById('messages');
    const input    = document.getElementById('chat-input');
    const sendBtn  = document.getElementById('send-btn');
    const notifDot = document.getElementById('notif-dot');

    bubble.addEventListener('click', () => {
      state.open = !state.open;
      bubble.classList.toggle('open', state.open);
      window_.classList.toggle('visible', state.open);

      if (state.open) {
        notifDot.style.display = 'none';
        if (messages.children.length === 0) {
          setTimeout(() => {
            addMessage('bot', `¡Hola! 👋 Soy tu asistente de compras.

Puedo ayudarte a:
• Buscar productos por nombre, color o talla
• Agregar cosas a tu carrito 🛒
• Ver y editar tu carrito

¿Qué estás buscando hoy?`);
          }, 350);
        }
        setTimeout(() => input.focus(), 400);
      }
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || state.loading) return;

      input.value = '';
      autoResize();
      addMessage('user', text);

      state.loading = true;
      sendBtn.disabled = true;
      const typingEl = showTyping();

      try {
        const body = {
          message: text,
          session_id: state.sessionId,
          history: state.history.slice(-10),
        };

        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json();
        typingEl.remove();

        if (data.session_id) state.sessionId = data.session_id;

        if (data.reply) {
          addMessage('bot', data.reply);
          state.history.push(
            { role: 'user', content: text },
            { role: 'assistant', content: data.reply }
          );
        } else if (data.error) {
          addMessage('bot', '⚠️ ' + (data.error || 'Ocurrió un error. Intenta de nuevo.'));
        }
      } catch (err) {
        typingEl.remove();
        addMessage('bot', '⚠️ No pude conectarme. Verifica tu conexión e intenta de nuevo.');
        console.error('Chat error:', err);
      } finally {
        state.loading = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function addMessage(role, text) {
      const isUser = role === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + (isUser ? 'user' : 'bot');

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = isUser ? '👤' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const wrapper = document.createElement('div');
      wrapper.className = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'typing-bubble';
      bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;

      return wrapper;
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    }

    input.addEventListener('input', autoResize);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    setTimeout(() => {
      if (!state.open) notifDot.style.display = 'block';
    }, 2000);
  </script>
</body>
</html>
